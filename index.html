<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SwiftDo</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header id="header">

<img
src="SwiftDo.png"
alt="SwiftDo Logo"
id="logo-image">

<nav>

<ul id="nav">

<li><a href="index.html">Home</a></li>

<li><a href="about.html">About</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

</header>


<div id="container">

<main id="main-content">

<h2>My Tasks</h2>
<br>
<p>
Organize your tasks efficiently
</p>



<input
type="text"
id="search"
placeholder="Search tasks...">

<form id="task-form">

<input
type="text"
id="task-input"
placeholder="Enter task"
required>

<input
type="date"
id="task-date">

<button type="submit">

Add

</button>

</form>


<div class="progress">

<div id="progress-bar">

</div>

</div>

<ul id="task-list"></ul>

</main>


<aside id="status-side">

<h3>Dashboard</h3>

<p>
Pending:
<span id="pending-count">
0
</span>
</p>

</aside>

</div>

<footer>

<p>

© 2026 SwiftDo

</p>

</footer>

<script src="script.js"></script>

</body>
</html>
